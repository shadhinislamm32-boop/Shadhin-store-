<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0b0f0d">
<title>SHADHIN STORE</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080c0a;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font-family:inherit;
  border:0;
  outline:0;
}

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#080c0a;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  transition:.5s;
}

.logo{
  width:92px;
  height:92px;
  border-radius:28px;
  background:linear-gradient(145deg,#20e77b,#079c4d);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:900;
  box-shadow:0 0 35px rgba(24,225,112,.35);
}

.logoText{
  margin-top:18px;
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.loader{
  width:130px;
  height:4px;
  background:#18231d;
  border-radius:10px;
  overflow:hidden;
  margin-top:24px;
}

.loader span{
  display:block;
  height:100%;
  width:0;
  background:#20e77b;
  animation:load 1.5s ease forwards;
}

@keyframes load{
  to{width:100%}
}

#app{
  display:none;
  min-height:100vh;
  padding-bottom:78px;
}

header{
  padding:18px 17px 10px;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,12,10,.94);
  backdrop-filter:blur(15px);
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:23px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand span{
  color:#20e77b;
}

.searchBtn{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#121a16;
  color:#fff;
  font-size:20px;
}

.searchBox{
  display:none;
  margin-top:12px;
}

.searchBox input{
  width:100%;
  padding:14px 16px;
  border-radius:15px;
  border:1px solid #1e3026;
  background:#101712;
  color:#fff;
  outline:none;
  font-size:15px;
}

.screen{
  padding:12px 16px 20px;
}

.hero{
  background:linear-gradient(135deg,#10251a,#0d1712);
  border:1px solid #193323;
  border-radius:22px;
  padding:22px 19px;
  margin-bottom:20px;
  overflow:hidden;
  position:relative;
}

.hero:after{
  content:"";
  width:150px;
  height:150px;
  border-radius:50%;
  background:#20e77b;
  opacity:.07;
  position:absolute;
  right:-45px;
  top:-45px;
}

.hero h1{
  font-size:25px;
  margin-bottom:8px;
}

.hero p{
  color:#94a69c;
  font-size:14px;
  line-height:1.5;
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0 12px;
}

.sectionTitle h2{
  font-size:18px;
}

.sectionTitle span{
  color:#20e77b;
  font-size:13px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.cat{
  flex:0 0 auto;
  padding:10px 15px;
  background:#111814;
  border:1px solid #1d2b23;
  color:#aebbb3;
  border-radius:30px;
  font-size:13px;
}

.cat.active{
  background:#20e77b;
  color:#061109;
  border-color:#20e77b;
  font-weight:bold;
}

.apps{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.card{
  background:#101612;
  border:1px solid #1b2921;
  border-radius:19px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:13px;
  cursor:pointer;
  transition:.2s;
}

.card:active{
  transform:scale(.98);
}

.appIcon{
  width:62px;
  height:62px;
  border-radius:17px;
  object-fit:cover;
  background:#18221c;
  flex:none;
}

.appInfo{
  min-width:0;
  flex:1;
}

.appInfo h3{
  font-size:16px;
  margin-bottom:5px;
}

.appInfo p{
  color:#829088;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.appCategory{
  color:#20e77b;
  font-size:11px;
  margin-top:6px;
}

.downloadMini{
  background:#173b28;
  color:#20e77b;
  padding:9px 11px;
  border-radius:12px;
  font-size:11px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:50px 15px;
  color:#68756d;
}

.emptyIcon{
  font-size:42px;
  margin-bottom:12px;
}

#details{
  display:none;
}

.back{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#121a16;
  color:#fff;
  font-size:22px;
  margin-bottom:18px;
}

.detailTop{
  display:flex;
  gap:15px;
  align-items:center;
}

.detailIcon{
  width:92px;
  height:92px;
  border-radius:23px;
  object-fit:cover;
  background:#172019;
}

.detailName{
  font-size:24px;
  font-weight:900;
}

.detailDev{
  color:#839087;
  font-size:13px;
  margin-top:7px;
}

.detailCategory{
  color:#20e77b;
  font-size:12px;
  margin-top:6px;
}

.downloadBig{
  width:100%;
  margin-top:25px;
  padding:15px;
  border-radius:16px;
  background:#20e77b;
  color:#061109;
  font-size:16px;
  font-weight:900;
}

.description{
  margin-top:25px;
  background:#101612;
  border:1px solid #1b2921;
  border-radius:18px;
  padding:17px;
}

.description h3{
  margin-bottom:10px;
}

.description p{
  color:#9aa69f;
  font-size:14px;
  line-height:1.6;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  height:68px;
  background:rgba(9,13,11,.96);
  border-top:1px solid #1a261f;
  display:flex;
  justify-content:space-around;
  align-items:center;
  backdrop-filter:blur(15px);
}

.navItem{
  width:25%;
  text-align:center;
  color:#68756d;
  font-size:11px;
  cursor:pointer;
}

.navIcon{
  display:block;
  font-size:20px;
  margin-bottom:4px;
}

.navItem.active{
  color:#20e77b;
}

#categoriesPage,
#searchPage{
  display:none;
}

.categoryGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.categoryBox{
  background:#101612;
  border:1px solid #1b2921;
  border-radius:19px;
  padding:23px 15px;
  text-align:center;
  cursor:pointer;
}

.categoryBox div{
  font-size:28px;
  margin-bottom:9px;
}

.categoryBox h3{
  font-size:14px;
}

.noResult{
  padding:40px 10px;
  text-align:center;
  color:#6d7972;
}
</style>
</head>

<body>

<div id="splash">
  <div class="logo">S</div>
  <div class="logoText">SHADHIN STORE</div>
  <div class="loader"><span></span></div>
</div>

<div id="app">

<header>
  <div class="topbar">
    <div class="brand">SHADHIN <span>STORE</span></div>
    <button class="searchBtn" onclick="toggleSearch()">⌕</button>
  </div>

  <div class="searchBox" id="searchBox">
    <input
      id="searchInput"
      type="text"
      placeholder="Search apps..."
      oninput="searchApps(this.value)"
    >
  </div>
</header>

<main class="screen">

<section id="home">

  <div class="hero">
    <h1>Discover Apps</h1>
    <p>Explore and download apps from SHADHIN STORE.</p>
  </div>

  <div class="sectionTitle">
    <h2>Categories</h2>
    <span onclick="showCategories()">View all</span>
  </div>

  <div class="categories" id="categoryButtons">
    <button class="cat active" onclick="filterCategory('All',this)">All</button>
    <button class="cat" onclick="filterCategory('AI',this)">AI</button>
    <button class="cat" onclick="filterCategory('Music',this)">Music</button>
    <button class="cat" onclick="filterCategory('Games',this)">Games</button>
    <button class="cat" onclick="filterCategory('Tools',this)">Tools</button>
  </div>

  <div class="sectionTitle">
    <h2>All Apps</h2>
    <span id="appCount"></span>
  </div>

  <div class="apps" id="appList"></div>

</section>

<section id="categoriesPage">
  <button class="back" onclick="goHome()">‹</button>

  <h1>Categories</h1>

  <div class="categoryGrid">
    <div class="categoryBox" onclick="selectCategory('AI')">
      <div>🤖</div>
      <h3>AI Apps</h3>
    </div>

    <div class="categoryBox" onclick="selectCategory('Music')">
      <div>🎵</div>
      <h3>Music</h3>
    </div>

    <div class="categoryBox" onclick="selectCategory('Games')">
      <div>🎮</div>
      <h3>Games</h3>
    </div>

    <div class="categoryBox" onclick="selectCategory('Tools')">
      <div>🛠️</div>
      <h3>Tools</h3>
    </div>
  </div>
</section>

<section id="searchPage">
  <h2>Search Results</h2>
  <div class="apps" id="searchResults"></div>
</section>

<section id="details">
  <button class="back" onclick="goHome()">‹</button>

  <div class="detailTop">
    <img class="detailIcon" id="detailIcon">

    <div>
      <div class="detailName" id="detailName"></div>
      <div class="detailDev" id="detailDev"></div>
      <div class="detailCategory" id="detailCategory"></div>
    </div>
  </div>

  <button class="downloadBig" id="downloadButton">
    DOWNLOAD APK
  </button>

  <div class="description">
    <h3>About this app</h3>
    <p id="detailDescription"></p>
  </div>
</section>

</main>

<nav class="bottomNav">

  <div class="navItem active" onclick="goHome()">
    <span class="navIcon">⌂</span>
    Home
  </div>

  <div class="navItem" onclick="showSearch()">
    <span class="navIcon">⌕</span>
    Search
  </div>

  <div class="navItem" onclick="showCategories()">
    <span class="navIcon">▦</span>
    Categories
  </div>

  <div class="navItem" onclick="goHome()">
    <span class="navIcon">◉</span>
    Apps
  </div>

</nav>

</div>

<script>

let allApps = [];
let currentCategory = "All";

/* Load online apps.json */
async function loadApps(){

  const list = document.getElementById("appList");

  list.innerHTML = `
    <div class="empty">
      <div class="emptyIcon">⏳</div>
      Loading apps...
    </div>
  `;

  try{

    const response = await fetch("./apps.json?time=" + Date.now());

    if(!response.ok){
      throw new Error("apps.json not found");
    }

    allApps = await response.json();

    if(!Array.isArray(allApps)){
      allApps = [];
    }

    renderApps(allApps);

  }catch(error){

    allApps = [];

    list.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">📦</div>
        <p>No apps available yet.</p>
      </div>
    `;

    document.getElementById("appCount").textContent = "";
  }
}


/* Render apps */
function renderApps(apps){

  const list = document.getElementById("appList");

  if(!apps.length){

    list.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">📦</div>
        <p>No apps available yet.</p>
      </div>
    `;

    document.getElementById("appCount").textContent = "";
    return;
  }

  document.getElementById("appCount").textContent =
    apps.length + " app" + (apps.length > 1 ? "s" : "");

  list.innerHTML = apps.map((app,index)=>`

    <div class="card" onclick="openDetails(${index},'main')">

      <img
        class="appIcon"
        src="${escapeHTML(app.icon || '')}"
        onerror="this.style.display='none'"
      >

      <div class="appInfo">
        <h3>${escapeHTML(app.name || "Unnamed App")}</h3>

        <p>
          ${escapeHTML(app.description || "No description available.")}
        </p>

        <div class="appCategory">
          ${escapeHTML(app.category || "Apps")}
        </div>
      </div>

      <button
        class="downloadMini"
        onclick="event.stopPropagation();downloadApp(${index},'main')"
      >
        Download
      </button>

    </div>

  `).join("");
}


/* Open details */
function openDetails(index){

  const app = allApps[index];

  if(!app) return;

  document.getElementById("home").style.display="none";
  document.getElementById("categoriesPage").style.display="none";
  document.getElementById("searchPage").style.display="none";
  document.getElementById("details").style.display="block";

  document.getElementById("detailIcon").src = app.icon || "";
  document.getElementById("detailName").textContent = app.name || "Unnamed App";
  document.getElementById("detailDev").textContent = app.developer || "SHADHIN";
  document.getElementById("detailCategory").textContent = app.category || "Apps";
  document.getElementById("detailDescription").textContent =
    app.description || "No description available.";

  const btn = document.getElementById("downloadButton");

  btn.onclick = function(){
    downloadApp(index);
  };

  window.scrollTo(0,0);
}


/* Download APK */
function downloadApp(index){

  const app = allApps[index];

  if(!app || !app.downloadUrl){

    alert("Download link is not available yet.");
    return;
  }

  const link = document.createElement("a");

  link.href = app.downloadUrl;
  link.target = "_blank";
  link.rel = "noopener";

  document.body.appendChild(link);
  link.click();
  link.remove();
}


/* Category filter */
function filterCategory(category,button){

  currentCategory = category;

  document.querySelectorAll(".cat").forEach(b=>{
    b.classList.remove("active");
  });

  if(button){
    button.classList.add("active");
  }

  if(category === "All"){
    renderApps(allApps);
  }else{
    renderApps(
      allApps.filter(app =>
        String(app.category || "").toLowerCase() ===
        category.toLowerCase()
      )
    );
  }
}


/* Search */
function searchApps(value){

  const q = value.trim().toLowerCase();

  if(!q){
    goHome();
    return;
  }

  document.getElementById("home").style.display="none";
  document.getElementById("categoriesPage").style.display="none";
  document.getElementById("details").style.display="none";
  document.getElementById("searchPage").style.display="block";

  const results = allApps.filter(app =>
    String(app.name || "").toLowerCase().includes(q) ||
    String(app.description || "").toLowerCase().includes(q) ||
    String(app.category || "").toLowerCase().includes(q)
  );

  const box = document.getElementById("searchResults");

  if(!results.length){

    box.innerHTML = `
      <div class="noResult">
        No apps found.
      </div>
    `;

    return;
  }

  box.innerHTML = results.map(app=>{

    const index = allApps.indexOf(app);

    return `
      <div class="card" onclick="openDetails(${index})">

        <img
          class="appIcon"
          src="${escapeHTML(app.icon || '')}"
        >

        <div class="appInfo">
          <h3>${escapeHTML(app.name || "Unnamed App")}</h3>
          <p>${escapeHTML(app.description || "")}</p>
          <div class="appCategory">
            ${escapeHTML(app.category || "Apps")}
          </div>
        </div>

        <button
          class="downloadMini"
          onclick="event.stopPropagation();downloadApp(${index})"
        >
          Download
        </button>

      </div>
    `;

  }).join("");
}


/* Search screen */
function showSearch(){

  document.getElementById("home").style.display="none";
  document.getElementById("categoriesPage").style.display="none";
  document.getElementById("details").style.display="none";
  document.getElementById("searchPage").style.display="block";

  document.getElementById("searchBox").style.display="block";

  setTimeout(()=>{
    document.getElementById("searchInput").focus();
  },100);
}


/* Categories */
function showCategories(){

  document.getElementById("home").style.display="none";
  document.getElementById("searchPage").style.display="none";
  document.getElementById("details").style.display="none";
  document.getElementById("categoriesPage").style.display="block";

  window.scrollTo(0,0);
}


function selectCategory(category){

  goHome();

  const button = [...document.querySelectorAll(".cat")]
    .find(b => b.textContent.trim() === category);

  filterCategory(category,button);
}


/* Home */
function goHome(){

  document.getElementById("home").style.display="block";
  document.getElementById("categoriesPage").style.display="none";
  document.getElementById("searchPage").style.display="none";
  document.getElementById("details").style.display="none";

  window.scrollTo(0,0);
}


/* Search button */
function toggleSearch(){

  const box = document.getElementById("searchBox");

  if(box.style.display === "block"){
    box.style.display="none";
  }else{
    box.style.display="block";

    setTimeout(()=>{
      document.getElementById("searchInput").focus();
    },100);
  }
}


/* Basic HTML escaping */
function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* Start */
setTimeout(()=>{

  document.getElementById("splash").style.opacity="0";

  setTimeout(()=>{

    document.getElementById("splash").style.display="none";
    document.getElementById("app").style.display="block";

    loadApps();

  },500);

},1700);

</script>

</body>
</html>
